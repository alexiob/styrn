[package]
name = "styrn"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[[bin]]
name = "styrn"
path = "src/main.rs"

[[example]]
name = "output-fixture-test"
path = "tests/fixtures/output_fixture.rs"

[[example]]
name = "outcome-fixture-test"
path = "tests/fixtures/outcome_fixture.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
toml = "1.1.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "2.0"
uuid = { version = "1.26", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.39"
tracing = "0.1"
sha2 = "0.11"

[dev-dependencies]
jsonschema = { version = "0.52", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
