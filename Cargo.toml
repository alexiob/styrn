[package]
name = "styrn"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[[bin]]
name = "styrn"
path = "src/main.rs"

[[example]]
name = "output-fixture-test"
path = "tests/fixtures/output_fixture.rs"

[[example]]
name = "outcome-fixture-test"
path = "tests/fixtures/outcome_fixture.rs"

[dependencies]
clap = { version = "=4.5.41", features = ["derive"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
base64 = "=0.21.7"
toml = "=0.8.19"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "1"
uuid = { version = "=1.11.0", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
tracing = "0.1"

[dev-dependencies]
jsonschema = { version = "=0.17.1", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
libc = "=0.2.189"
