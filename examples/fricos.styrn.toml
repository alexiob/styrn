# Styrn project profile — FriCOS reference (the initial consuming project).
# Canonical shape: docs/design.md Part 9.1. Validated by schemas/project-v1.schema.json.
#
# Lives at the repository root as `.styrn.toml`.
#
# The division of labour: this file holds all build-system knowledge (Cargo
# flags, parallelism env vars). Styrn only expands resource variables and
# executes the declared command (Part 1.9 — generic, not abstract).

schema_version = 1
minimum_styrn_version = "0.1.0"

[project]
name = "fricos"

[source]
kind = "git"
default_branch = "main"

# Source reaches workers by CONTROLLER PUSH by default: workers hold zero forge
# credentials and validation works with the forge unreachable (Part 8.2, D-1).
# Opt in to worker-side fetching only if a project genuinely needs it:
#
# [source.auth]
# mode = "deploy-key"                    # "push" (default) | "deploy-key"
# remote = "git@github.com:iob-dev/fricos.git"

[workspace]
strategy = "git-worktree"
ephemeral = true

[variables]
PROJECT_ROOT = "${workspace.root}"
JOB_ROOT = "${job.root}"

# Feeds the resource governor's admission arithmetic (Part 7.2). Absent hints
# fall back to documented defaults (2 GiB memory, 20 GiB disk per job) rather
# than to constants an implementer invents.
[resource_hints]
compile_memory_per_job_bytes = 2684354560   # 2.5 GiB
test_memory_per_job_bytes = 2147483648      # 2 GiB
disk_per_job_bytes = 21474836480            # 20 GiB (rev. E)

# Convenience aliases: `styrn check`, `styrn test`, `styrn validate` (9.4).
[aliases]
check = "check"
test = "test-smoke"
validate = "cross-platform"

# --- Workflows -------------------------------------------------------------
# resource_class: light | normal | heavy. `heavy` engages max_heavy_jobs
# exclusivity (7.6) and heavy-peak admission (7.2).

[workflows.check]
description = "Fast workspace check"
resource_class = "light"
command = ["cargo", "check", "--workspace"]
timeout_seconds = 1200

[workflows.check.requirements]
build = true

[workflows.check.environment]
CARGO_BUILD_JOBS = "${resources.compile_jobs}"
CARGO_TARGET_DIR = "${job.root}/target"
CARGO_INCREMENTAL = "0"
RUSTC_WRAPPER = "sccache"

[workflows.test-smoke]
description = "Resource-aware smoke tests"
resource_class = "normal"
command = ["cargo", "test", "--workspace"]
timeout_seconds = 1800

[workflows.test-smoke.requirements]
build = true

[workflows.test-smoke.environment]
CARGO_BUILD_JOBS = "${resources.compile_jobs}"
RUST_TEST_THREADS = "${resources.test_jobs}"
CARGO_TARGET_DIR = "${job.root}/target"
CARGO_INCREMENTAL = "0"
RUSTC_WRAPPER = "sccache"

[workflows.test-windows-heavy]
description = "Authoritative native Windows validation"
resource_class = "heavy"
command = ["cargo", "test", "--workspace"]
timeout_seconds = 7200

[workflows.test-windows-heavy.requirements]
os = "windows"
heavy_test = true

[workflows.test-windows-heavy.environment]
CARGO_BUILD_JOBS = "${resources.compile_jobs}"
RUST_TEST_THREADS = "${resources.test_jobs}"
CARGO_TARGET_DIR = "${job.root}/target"
CARGO_INCREMENTAL = "0"
RUSTC_WRAPPER = "sccache"

[workflows.test-linux-heavy]
description = "Authoritative Linux validation"
resource_class = "heavy"
command = ["cargo", "test", "--workspace"]
timeout_seconds = 7200

[workflows.test-linux-heavy.requirements]
os = "linux"
heavy_test = true

[workflows.test-linux-heavy.environment]
CARGO_BUILD_JOBS = "${resources.compile_jobs}"
RUST_TEST_THREADS = "${resources.test_jobs}"
CARGO_TARGET_DIR = "${job.root}/target"
CARGO_INCREMENTAL = "0"
RUSTC_WRAPPER = "sccache"

[cleanup]
delete_successful_job_workspace = true
failed_job_retention_hours = 24
log_retention_days = 7
